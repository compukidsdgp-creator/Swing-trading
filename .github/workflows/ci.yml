name: CI

# Runs on every push and pull request touching Python.
#
# Why this exists: during development, patches silently failed to apply and
# functions were accidentally deleted by careless string replacement. Both
# would have been caught here in seconds. Manual verification does not scale
# and does not remember.
on:
  push:
    paths: ['**.py', 'requirements.txt', '.github/workflows/ci.yml']
  pull_request:
    paths: ['**.py', 'requirements.txt']
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # --- Fast checks first: fail in seconds, not minutes ---
      - name: Syntax check all modules
        run: |
          python - <<'PY'
          import ast, pathlib, sys
          bad = []
          for p in sorted(pathlib.Path('.').glob('*.py')):
              try:
                  ast.parse(p.read_text())
              except SyntaxError as e:
                  bad.append(f"{p.name}:{e.lineno}: {e.msg}")
          if bad:
              print("SYNTAX ERRORS:")
              [print("  " + b) for b in bad]
              sys.exit(1)
          print(f"{len(list(pathlib.Path('.').glob('*.py')))} modules parse OK")
          PY

      - name: Check every module imports
        run: |
          python - <<'PY'
          import importlib, pathlib, sys
          skip = {"app", "test_invariants", "benchmark"}   # app needs a Streamlit runtime
          failed = []
          for p in sorted(pathlib.Path('.').glob('*.py')):
              name = p.stem
              if name in skip:
                  continue
              try:
                  importlib.import_module(name)
              except Exception as e:
                  failed.append(f"{name}: {type(e).__name__}: {e}")
          if failed:
              print("IMPORT FAILURES:")
              [print("  " + f) for f in failed]
              sys.exit(1)
          print("all modules import cleanly")
          PY

      # --- The check that would have caught tonight's deleted functions ---
      - name: Check app.py wiring
        run: |
          python - <<'PY'
          import ast, re, sys
          src = open('app.py').read()
          tree = ast.parse(src)
          defined = {n.name for n in tree.body if isinstance(n, ast.FunctionDef)}
          called = set(re.findall(r'\b(render_\w+|_bucket_dialog|_report_links_sidebar)\s*\(', src))
          missing = sorted(called - defined)
          if missing:
              print(f"CALLED BUT NOT DEFINED: {missing}")
              sys.exit(1)

          m = re.search(r'st\.tabs\(\[(.*?)\]\)', src, re.S)
          n_tabs = m.group(1).count(',') + 1
          idxs = sorted({int(i) for i in re.findall(r'with tabs\[(\d+)\]', src)})
          if idxs != list(range(n_tabs)):
              print(f"TAB MISMATCH: {n_tabs} declared, wired {idxs}")
              sys.exit(1)
          print(f"app.py OK — {len(defined)} functions, {n_tabs} tabs correctly wired")
          PY

      # --- Property-based suite ---
      - name: Invariant tests
        run: python test_invariants.py 25

      # --- Security ---
      #
      # Credentials committed even once live in git history forever, and bots
      # scan public repos for them within minutes. A grep is not a substitute
      # for a real scanner, but it catches the obvious cases before push.
      - name: Scan for committed secrets
        run: |
          python - <<'PY'
          import pathlib, re, sys

          patterns = {
              "Telegram bot token": r"\b\d{8,10}:[A-Za-z0-9_-]{35}\b",
              "generic API key":    r"(?i)(api[_-]?key|apikey)\s*[=:]\s*['\"][A-Za-z0-9_\-]{16,}['\"]",
              "generic secret":     r"(?i)(secret|password|passwd)\s*[=:]\s*['\"][^'\"]{8,}['\"]",
              "AWS access key":     r"\bAKIA[0-9A-Z]{16}\b",
              "private key block":  r"-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----",
              "TOTP secret":        r"(?i)totp[_-]?secret\s*[=:]\s*['\"][A-Z2-7]{16,}['\"]",
          }

          # Placeholder detection. Setup documentation legitimately contains
          # lines like api_secret = "your_secret". Flagging those trains people
          # to ignore the scanner, which is worse than not having one.
          placeholder = re.compile(
              r"(?i)(your[_-]?|my[_-]?|example|placeholder|dummy|sample|"
              r"changeme|change[_-]?me|xxx+|<[^>]+>|\.\.\.|todo|fixme|"
              r"insert[_-]?|replace[_-]?|abc123|test[_-]?key|foo|bar)"
          )

          allow_files = ("secrets.toml.example", "README.md", "MANUAL.md",
                         "ci.yml", "RUNBOOK.md", "AUDIT_REPORT.md",
                         "COMPLIANCE_AUDIT.md", "20YEAR_VALIDATION_REPORT.md",
                         "ROADMAP_30_DAYS.md")

          hits = []
          for p in pathlib.Path(".").rglob("*"):
              if not p.is_file() or ".git/" in str(p):
                  continue
              if p.suffix not in (".py", ".yml", ".yaml", ".toml", ".json",
                                  ".env", ".cfg", ".ini", ".txt"):
                  continue
              if p.name in allow_files:
                  continue
              try:
                  text = p.read_text(errors="ignore")
              except Exception:
                  continue
              for label, pat in patterns.items():
                  for m in re.finditer(pat, text):
                      matched = m.group(0)
                      if placeholder.search(matched):
                          continue          # documentation placeholder
                      line = text[:m.start()].count("\n") + 1
                      hits.append(f"{p}:{line}: possible {label} -> {matched[:60]}")

          if hits:
              print("POSSIBLE SECRETS COMMITTED:")
              for h in hits[:20]:
                  print("  " + h)
              print("\nIf real: revoke the credential immediately, then remove it "
                    "from git history. Rotating is not optional — it is already public.")
              print("If a placeholder the filter missed, add it to the placeholder "
                    "pattern rather than disabling the check.")
              sys.exit(1)
          print("No committed secrets detected.")
          PY

      - name: Check .gitignore covers credential files
        run: |
          python - <<'PY'
          import pathlib, sys
          required = [".streamlit/secrets.toml", "__pycache__"]
          gi = pathlib.Path(".gitignore")
          if not gi.exists():
              print(".gitignore is missing — credential files are unprotected.")
              sys.exit(1)
          content = gi.read_text()
          missing = [r for r in required if r not in content]
          if missing:
              print(f".gitignore does not cover: {missing}")
              sys.exit(1)
          print(".gitignore covers credential paths.")
          PY

      - name: Audit dependencies for known vulnerabilities
        run: |
          pip install pip-audit --quiet 2>/dev/null || true
          pip-audit --desc --skip-editable 2>&1 | tail -30 || \
            echo "pip-audit unavailable — skipping (non-blocking)"
        continue-on-error: true

      - name: Report result
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            echo "### ✅ All checks passed" >> $GITHUB_STEP_SUMMARY
          else
            echo "### ❌ Checks failed — do not deploy this commit" >> $GITHUB_STEP_SUMMARY
          fi
