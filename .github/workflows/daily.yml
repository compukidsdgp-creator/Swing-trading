name: SwingScope daily tracker

on:
  schedule:
    - cron: '30 3 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  track:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt openpyxl
      - name: Run daily tracker
        env:
          TELEGRAM_TOKEN:   ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python pipeline.py \
            --universe "Nifty 500" \
            --size 10 \
            --horizon 15 \
            --model momentum \
            --daily-track \
            --no-log \
            --no-pdf \
            --skip-news \
            --notify --channels telegram
        continue-on-error: true
      - name: Commit diary
        run: |
          git config user.name  "swingscope-bot"
          git config user.email "actions@github.com"
          git add daily_observations.csv daily_prices.csv reports/ || true
          git diff --staged --quiet || git commit -m "Daily tracker $(date +%F)"
          git push || true
