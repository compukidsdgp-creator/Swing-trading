name: SwingScope daily tracker

# Runs every weekday BEFORE market open (09:00 IST = 03:30 UTC).
# The bucket is computed from the previous session's close, which is the
# correct basis for deciding what to trade today.
#
# NOTE: this only appends to the daily DIARY. It does not touch forward_log.csv,
# whose weekly non-overlapping windows are the actual statistical evidence.
on:
  schedule:
    - cron: '30 3 * * 2-5'   # Tue-Fri. Monday is covered by main.yml.
  workflow_dispatch:

# Prevent overlapping runs of this workflow. Several workflows commit to the
# same branch, and concurrent pushes previously failed silently.
concurrency:
  group: swingscope-write
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  track:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt openpyxl

      - name: Run daily tracker
        env:
          TELEGRAM_TOKEN:   ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SMTP_HOST:        ${{ secrets.SMTP_HOST }}
          SMTP_PORT:        ${{ secrets.SMTP_PORT }}
          SMTP_USER:        ${{ secrets.SMTP_USER }}
          SMTP_PASS:        ${{ secrets.SMTP_PASS }}
          REPORT_TO:        ${{ secrets.REPORT_TO }}
        run: |
          python pipeline.py \
            --universe "Nifty 500" \
            --size 10 \
            --horizon 15 \
            --model momentum \
            --daily-track \
            --no-log \
            --no-pdf \
            --skip-news \
            --notify --channels telegram
        # NOTE: no continue-on-error. It suppresses the job's failure state,
        # which means `if: failure()` below never fires — the alert was dead
        # code. A run that fails should be loudly visible.

      - name: Commit results
        run: |
          git config user.name  "swingscope-bot"
          git config user.email "actions@github.com"
          git add daily_observations.csv daily_prices.csv reports/ || true
          if git diff --staged --quiet; then
            echo "Nothing to commit."
            exit 0
          fi
          git commit -m "Daily tracker $(date +%F)"

          # Retry with rebase. Concurrent runs cause non-fast-forward
          # rejections, and `git push || true` silently DISCARDS the commit —
          # for forward_log.csv that is irreplaceable data loss.
          for i in 1 2 3 4 5; do
            if git push; then
              echo "Pushed on attempt $i."
              exit 0
            fi
            echo "Push rejected (attempt $i) — rebasing onto remote."
            git pull --rebase --autostash origin "${GITHUB_REF_NAME:-main}" || true
            sleep $((i * 4))
          done
          echo "::error::Could not push after 5 attempts. Commit not persisted."
          exit 1

      - name: Upload workbook
        uses: actions/upload-artifact@v5
        with:
          name: daily-tracker-${{ github.run_number }}
          path: |
            reports/daily_tracker.xlsx
            daily_observations.csv
          if-no-files-found: warn
          retention-days: 90

      # Silent failure is the worst outcome: no Telegram message looks exactly
      # like a quiet market. This makes a broken run announce itself.
      - name: Alert on failure
        if: failure()
        env:
          TELEGRAM_TOKEN:   ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -s -X POST             "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage"             -d chat_id="${TELEGRAM_CHAT_ID}"             -d parse_mode="Markdown"             -d text="🔴 *SwingScope workflow FAILED*%0A%0AWorkflow: ${{ github.workflow }}%0ARun: ${{ github.run_number }}%0A%0AThe run did not complete. Until this is fixed the forward log stops accumulating.%0A%0Ahttps://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"             || true
