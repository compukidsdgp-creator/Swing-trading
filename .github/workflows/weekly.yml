name: SwingScope weekly run

# Monday 03:30 UTC = 09:00 IST
on:
  schedule:
    - cron: '30 3 * * 1'          # every Monday 09:00 IST — weekly run
    - cron: '0 4 1 * *'           # 1st of each month 09:30 IST — month-end review
  workflow_dispatch:
    inputs:
      universe:
        description: 'Universe to scan'
        default: 'Nifty 500'
      top:
        description: 'Picks to record'
        default: '10'

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      # WeasyPrint needs these for PDF output. Drop this step and pass
      # --no-pdf if you only want the HTML report.
      - name: Install PDF system libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libpango-1.0-0 libpangoft2-1.0-0 libcairo2 libgdk-pixbuf-2.0-0

      - name: Install Python dependencies
        run: pip install -r requirements.txt weasyprint

      - name: Run snapshot, evaluation and report
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          REPORT_TO: ${{ secrets.REPORT_TO }}
        run: |
          # Add --monthly on the 1st of the month
          EXTRA=""
          if [ "$(date +%d)" = "01" ]; then EXTRA="--monthly"; fi
          python automate.py \
            --universe "${{ github.event.inputs.universe || 'Nifty 500' }}" \
            --top "${{ github.event.inputs.top || 10 }}" \
            --horizon 15 \
            --email $EXTRA
        continue-on-error: true

      - name: Commit log and reports
        run: |
          git config user.name  "swingscope-bot"
          git config user.email "actions@github.com"
          git add forward_log.csv reports/ || true
          git diff --staged --quiet || git commit -m "Weekly run $(date +%Y-%m-%d)"
          git push || true

      # Downloadable from the Actions run page, kept for 90 days
      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: swingscope-report-${{ github.run_number }}
          path: |
            reports/latest.html
            reports/latest.pdf
            reports/latest.txt
            reports/latest_monthly.html
            reports/latest_monthly.pdf
            forward_log.csv
          if-no-files-found: warn
          retention-days: 90
